version: 0.2

env:
  shell: bash
  variables:
    TF_VERSION: "1.14.8"
    TF_OS: linux
    TF_ARCH: arm64
    TF_EXEC_PATH: terraform
phases:
  install:
    commands:
      - echo Installing Terraform...
      - curl -sL https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_${TF_OS}_${TF_ARCH}.zip > terraform.zip
      - unzip terraform.zip -d /tmp
      - chmod +x /tmp/terraform
      - export PATH=/tmp:$PATH
      - terraform version
  pre_build:
    commands:
      - |
        source "$(git rev-parse --show-toplevel)/builder/agent_image_replication.sh"
        if [ "${TF_ACTION}" = "apply" ]; then
          docker version
          AGENT_IMAGE_URL="$(prepare_agent_image "${AGENT_IMAGE_URL}" "${AGENT_IMAGE_MIRROR_REPOSITORY_URI:-}" "${AWS_REGION}")"
        elif [ "${TF_ACTION}" = "destroy" ]; then
          AGENT_IMAGE_URL="$(resolve_agent_image_url "${AGENT_IMAGE_URL}")"
        fi
      - cd ${TF_EXEC_PATH}
      - echo Initializing Terraform...
      - terraform init
        -lockfile=readonly
        -backend-config="bucket=${TF_STATE_BUCKET}"
        -backend-config="key=${PREFIX}-tracis.tfstate"
        -backend-config="region=${AWS_REGION}"
        -backend-config="use_lockfile=true"
  build:
    commands:
      - echo "Executing terraform ${TF_ACTION}..."
      - |
        set -euo pipefail

        AGENTCORE_RUNTIME_SG_ADDRESS="module.agent.aws_security_group.agentcore_runtime"
        TF_VAR_ARGS=(
          -var="prefix=${PREFIX}" \
          -var="subnet_ids=${SUBNET_IDS}" \
          -var="enabled_db_types=${ENABLED_DB_TYPES}" \
          -var="mysql_endpoint=${MYSQL_ENDPOINT}" \
          -var="mysql_port=${MYSQL_PORT}" \
          -var="mysql_db_name=${MYSQL_DB_NAME}" \
          -var="mysql_security_group_ids=${MYSQL_SECURITY_GROUP_IDS}" \
          -var="mysql_secret_arn=${MYSQL_SECRET_ARN}" \
          -var="chat_tools_secret_arn=${CHAT_TOOLS_SECRET_ARN}" \
          -var="bedrock_model_id=${BEDROCK_MODEL_ID}" \
          -var="max_tokens=${MAX_TOKENS}" \
          -var="pii_output_entity_types=${PII_OUTPUT_ENTITY_TYPES}" \
          -var="agent_image_url=${AGENT_IMAGE_URL}"
        )

        if [ "${TF_ACTION}" = "apply" ]; then
          # Reuse the AgentCore Runtime SG retained while its VPC ENI is released.
          if ! TF_STATE_RESOURCES="$(terraform state list 2>terraform-state-list.err)"; then
            if grep -Fq "No state file was found!" terraform-state-list.err; then
              TF_STATE_RESOURCES=""
            else
              cat terraform-state-list.err >&2
              exit 1
            fi
          fi

          if ! grep -Fxq "${AGENTCORE_RUNTIME_SG_ADDRESS}" <<< "${TF_STATE_RESOURCES}"; then
            IFS=',' read -r -a SUBNET_ID_ARRAY <<< "${SUBNET_IDS}"
            AGENTCORE_RUNTIME_VPC_ID="$(aws ec2 describe-subnets \
              --subnet-ids "${SUBNET_ID_ARRAY[@]}" \
              --query 'Subnets[0].VpcId' \
              --output text)"
            AGENTCORE_RUNTIME_SG_ID="$(aws ec2 describe-security-groups \
              --filters \
                "Name=group-name,Values=${PREFIX}-tracis-ai-agentcore-runtime-sg" \
                "Name=vpc-id,Values=${AGENTCORE_RUNTIME_VPC_ID}" \
              --query 'SecurityGroups[0].GroupId' \
              --output text)"

            if [ "${AGENTCORE_RUNTIME_SG_ID}" != "None" ] && [ -n "${AGENTCORE_RUNTIME_SG_ID}" ]; then
              echo "Importing retained AgentCore Runtime SG ${AGENTCORE_RUNTIME_SG_ID}..."
              terraform import \
                -input=false \
                "${TF_VAR_ARGS[@]}" \
                "${AGENTCORE_RUNTIME_SG_ADDRESS}" \
                "${AGENTCORE_RUNTIME_SG_ID}"
            fi
          fi
        fi

        if [ "${TF_ACTION}" = "destroy" ]; then
          # AgentCore VPC ENIs can outlive Runtime deletion and block SG deletion.
          # Retain this SG only after its configured deletion timeout expires.
          set +e
          terraform destroy -auto-approve "${TF_VAR_ARGS[@]}" 2>&1 | tee terraform-destroy.log
          TF_DESTROY_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ "${TF_DESTROY_EXIT_CODE}" -ne 0 ]; then
            if grep -Eq "Error:.*deleting Security Group" terraform-destroy.log \
              && grep -Fq "${AGENTCORE_RUNTIME_SG_ADDRESS}" terraform-destroy.log \
              && grep -Eq "DependencyViolation|timeout while waiting for state to become 'destroyed'" terraform-destroy.log; then
              echo "Retaining AgentCore Runtime SG until the service-managed ENI is released..."
              terraform state rm "${AGENTCORE_RUNTIME_SG_ADDRESS}"
              terraform destroy -auto-approve "${TF_VAR_ARGS[@]}"
            else
              exit "${TF_DESTROY_EXIT_CODE}"
            fi
          fi
        else
          terraform "${TF_ACTION}" -auto-approve "${TF_VAR_ARGS[@]}"
        fi

        if [ "${TF_ACTION}" = "destroy" ]; then
          touch /tmp/terraform-destroy-succeeded
        fi

  post_build:
    commands:
      - |
        if [ "${TF_ACTION}" = "destroy" ] && [ -f /tmp/terraform-destroy-succeeded ]; then
          echo Deleting Terraform state file from S3...

          aws s3api list-object-versions \
            --bucket ${TF_STATE_BUCKET} \
            --prefix "${PREFIX}-tracis.tfstate" \
            --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' \
            --output json > versions.json
          if [ "$(jq '.Objects | length' versions.json)" != "0" ]; then
            aws s3api delete-objects \
              --bucket ${TF_STATE_BUCKET} \
              --delete file://versions.json
          fi

          aws s3api list-object-versions \
            --bucket ${TF_STATE_BUCKET} \
            --prefix "${PREFIX}-tracis.tfstate" \
            --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' \
            --output json > delete-markers.json
          if [ "$(jq '.Objects | length' delete-markers.json)" != "0" ]; then
            aws s3api delete-objects \
              --bucket ${TF_STATE_BUCKET} \
              --delete file://delete-markers.json
          fi
        elif [ "${TF_ACTION}" = "destroy" ]; then
          echo "Skipping Terraform state deletion because terraform destroy failed."
        fi
