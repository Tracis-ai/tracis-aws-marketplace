AWSTemplateFormatVersion: "2010-09-09"
Description: Terraform execution environment (S3 and CodeBuild) for TracisAI Agent deployment.

Parameters:
  AgentImageUrl:
    Type: String
    Default: ""
    Description: "(Optional) ECR image URL for TracisAI Agent. Specify only to use a particular image."
  AgentSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Subnet IDs for deploying TracisAI Agent."
  BedrockModelId:
    Type: String
    Default: "global.anthropic.claude-sonnet-4-6"
    Description: "Bedrock model ID (e.g., global.anthropic.claude-sonnet-4-6)."
  BedrockModelMaxTokens:
    Type: Number
    Default: 8192
    Description: "Maximum number of tokens for the Bedrock model."
  PiiOutputEntityTypes:
    Type: CommaDelimitedList
    Default: "ADDRESS,AWS_ACCESS_KEY,AWS_SECRET_KEY,CREDIT_DEBIT_CARD_CVV,CREDIT_DEBIT_CARD_EXPIRY,CREDIT_DEBIT_CARD_NUMBER,EMAIL,NAME,PASSWORD,PHONE,PIN,USERNAME"
    Description: "PII types to anonymize in agent output. Enter multiple values as a comma-delimited list."
  EnabledDbTypes:
    Type: CommaDelimitedList
    Default: "mysql"
    Description: "Database type to connect. Only mysql is currently supported."
    AllowedValues:
      - mysql
  MySqlEndpoint:
    Type: String
    Default: ""
    Description: "(Optional; required when using MySQL) MySQL database endpoint (e.g., mydb.cluster-ro-123456789012.ap-northeast-1.rds.amazonaws.com)."
  MySqlPort:
    Type: Number
    Default: 3306
    Description: "(Optional; required when using MySQL) MySQL database port."
  MySqlDbName:
    Type: String
    Default: ""
    Description: "(Optional; required when using MySQL) MySQL database name."
  MySqlSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "(Optional; required when using MySQL) MySQL database security group IDs as a comma-delimited list."
  MySqlSecretArn:
    Type: String
    Default: ""
    Description: "(Optional) ARN of the AWS Secrets Manager secret containing MySQL credentials. A secret is created if omitted."
  Prefix:
    Type: String
    Description: "Prefix for names of created resources. Use lowercase letters, numbers, and hyphens only; do not begin or end with a hyphen."
    MinLength: 1
    MaxLength: 28
    AllowedPattern: "[a-z0-9]([a-z0-9-]*[a-z0-9])?"
    ConstraintDescription: "Enter up to 28 lowercase letters, numbers, and hyphens; do not begin or end with a hyphen."
  ChatToolsSecretArn:
    Type: String
    Default: ""
    Description: "(Optional) ARN of the AWS Secrets Manager secret containing chat tool credentials. A secret is created if omitted."
  SourceVersion:
    Type: String
    Default: ""
    Description: "(Optional) Source version of the GitHub repository. Specify only for a particular tag or commit."
Mappings:
  ReleaseConfig:
    Current:
      SourceVersion: "v202608-2d61f5612560"

Conditions:
  SourceVersionNotSpecified: !Equals
    - !Ref SourceVersion
    - ""

Resources:
  TfStateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${Prefix}-tracis-tfstate-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldVersions
            Status: Enabled
            ExpiredObjectDeleteMarker: true
            NoncurrentVersionExpiration:
              NoncurrentDays: 60

  TfLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${Prefix}-tracis-terraform-logs"
      RetentionInDays: 120

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-tracis-tf-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                "aws:SourceArn":
                  - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${Prefix}-tracis-deploy-agent"
                  - !Sub "arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${Prefix}-tracis-delete-agent"
      Policies:
        - PolicyName: CodeBuildLogsPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CodeBuildLogsAccess
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${TfLogGroup.Arn}:*"
        - PolicyName: TerraformStatePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TfStateBucketAccess
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !GetAtt TfStateBucket.Arn
                  - !Sub "${TfStateBucket.Arn}/*"
        - PolicyName: ComputeAndNetworkResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EC2Access
                Effect: Allow
                Action:
                  - ec2:AuthorizeSecurityGroup*
                  - ec2:CreateSecurityGroup
                  - ec2:CreateTags
                  - ec2:DeleteNetworkInterface
                  - ec2:DeleteSecurityGroup
                  - ec2:DeleteTags
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSecurityGroupRules
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcAttribute
                  - ec2:DescribeVpcs
                  - ec2:ModifySecurityGroupRules
                  - ec2:RevokeSecurityGroup*
                  - ec2:UpdateSecurityGroupRuleDescriptions*
                Resource: "*"
              - Sid: RDSDescribeAccess
                Effect: Allow
                Action:
                  - rds:DescribeDBClusters
                  - rds:DescribeDBInstances
                Resource: "*"
        - PolicyName: StorageAndMessagingResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3Access
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${Prefix}-*"
                  - !Sub "arn:${AWS::Partition}:s3:::${Prefix}-*/*"
              - Sid: S3GetObjectGlobalAccess
                Effect: Allow
                Action: s3:GetObject
                Resource: "*"
              - Sid: S3VectorsAccess
                Effect: Allow
                Action: s3vectors:*
                Resource: !Sub "arn:${AWS::Partition}:s3vectors:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: SQSAccess
                Effect: Allow
                Action: sqs:*
                Resource: !Sub "arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${Prefix}-*"
              - Sid: KMSAccess
                Effect: Allow
                Action: kms:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*"
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/*"
              - Sid: KMSGlobalAccess
                Effect: Allow
                Action:
                  - kms:CreateKey
                  - kms:ListAliases
                  - kms:ListKeys
                Resource: "*"
              - Sid: SecretsManagerAccess
                Effect: Allow
                Action: secretsmanager:*
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}-*"
        - PolicyName: AIAndLogsResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockAccess
                Effect: Allow
                Action:
                  - bedrock:*
                  - bedrock-agent:*
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: AgentCoreGlobalAccess
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateAgentRuntime
                  - bedrock-agentcore:CreateAgentRuntimeEndpoint
                  - bedrock-agentcore:ListAgentRuntimeEndpoints
                  - bedrock-agentcore:ListAgentRuntimes
                  - bedrock-agentcore:ListAgentRuntimeVersions
                Resource: "*"
              - Sid: AgentCoreRuntimeAccess
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateWorkloadIdentity
                  - bedrock-agentcore:DeleteAgentRuntime
                  - bedrock-agentcore:DeleteAgentRuntimeEndpoint
                  - bedrock-agentcore:DeleteWorkloadIdentity
                  - bedrock-agentcore:DeleteResourcePolicy
                  - bedrock-agentcore:GetAgentRuntime
                  - bedrock-agentcore:GetAgentRuntimeEndpoint
                  - bedrock-agentcore:GetResourcePolicy
                  - bedrock-agentcore:ListTagsForResource
                  - bedrock-agentcore:PutResourcePolicy
                  - bedrock-agentcore:TagResource
                  - bedrock-agentcore:UntagResource
                  - bedrock-agentcore:UpdateAgentRuntime
                  - bedrock-agentcore:UpdateAgentRuntimeEndpoint
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/*/runtime-endpoint/*"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default"
                  - !Sub "arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/*"
              - Sid: CloudWatchLogsGroupAccess
                Effect: Allow
                Action: logs:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*${Prefix}-*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*${Prefix}-*:*"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/tracis-ai/statistics/${Prefix}"
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/tracis-ai/statistics/${Prefix}:*"
              - Sid: CloudWatchLogsDeliveryAccess
                Effect: Allow
                Action:
                  - logs:CreateDelivery
                  - logs:CreateLogDelivery
                  - logs:CreateLogGroup
                  - logs:DeleteDelivery*
                  - logs:DeleteLogDelivery
                  - logs:DeleteLogGroup
                  - logs:DeleteResourcePolicy
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:GetDelivery*
                  - logs:ListDeliveries*
                  - logs:ListLogDeliveries
                  - logs:ListTags*
                  - logs:PutDelivery*
                  - logs:PutResourcePolicy
                  - logs:PutRetentionPolicy
                  - logs:TagResource
                  - logs:UpdateDelivery
                  - logs:UpdateLogDelivery
                Resource: "*"
        - PolicyName: ServerlessAndIAMResourcePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IAMAccess
                Effect: Allow
                Action: iam:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${Prefix}-*"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/${Prefix}-*"
              - Sid: AWSManagedLambdaENIPolicyRead
                Effect: Allow
                Action:
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                Resource: !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaENIManagementAccess"
              - Sid: IAMServiceLinkedRoleAccess
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  - iam:DeleteServiceLinkedRole
                  - iam:GetServiceLinkedRoleDeletionStatus
                Resource: "*"
              - Sid: LambdaAccess
                Effect: Allow
                Action: lambda:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${Prefix}-*"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:layer:aws-lambda-powertools-*"
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*"
              - Sid: LambdaEventSourceMappingCreateAndListAccess
                Effect: Allow
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: "*"
              - Sid: APIGatewayAccess
                Effect: Allow
                Action: apigateway:*
                Resource: !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::*"
              - Sid: CloudFormationAccess
                Effect: Allow
                Action:
                  - cloudformation:*
                  - serverlessrepo:*
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${Prefix}-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/serverlessrepo-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-serverless-repository-*/*"
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/*"
                  - !Sub "arn:${AWS::Partition}:serverlessrepo:*:*:applications/*"

  CodeBuildDeployAgent:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${Prefix}-tracis-deploy-agent"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_LAMBDA_CONTAINER
        ComputeType: BUILD_LAMBDA_2GB
        Image: aws/codebuild/amazonlinux-aarch64-lambda-standard:python3.13
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: TF_STATE_BUCKET
            Value: !Ref TfStateBucket
          - Name: TF_ACTION
            Value: apply
          - Name: PREFIX
            Value: !Ref Prefix
          - Name: SUBNET_IDS
            Value: !Join [",", !Ref AgentSubnetIds]
          - Name: ENABLED_DB_TYPES
            Value: !Join [",", !Ref EnabledDbTypes]
          - Name: MYSQL_ENDPOINT
            Value: !Ref MySqlEndpoint
          - Name: MYSQL_PORT
            Value: !Ref MySqlPort
          - Name: MYSQL_DB_NAME
            Value: !Ref MySqlDbName
          - Name: MYSQL_SECURITY_GROUP_IDS
            Value: !Join [",", !Ref MySqlSecurityGroupIds]
          - Name: MYSQL_SECRET_ARN
            Value: !Ref MySqlSecretArn
          - Name: CHAT_TOOLS_SECRET_ARN
            Value: !Ref ChatToolsSecretArn
          - Name: AGENT_IMAGE_URL
            Value: !Ref AgentImageUrl
          - Name: BEDROCK_MODEL_ID
            Value: !Ref BedrockModelId
          - Name: MAX_TOKENS
            Value: !Ref BedrockModelMaxTokens
          - Name: PII_OUTPUT_ENTITY_TYPES
            Value: !Join [",", !Ref PiiOutputEntityTypes]
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref TfLogGroup
          StreamName: !Sub "${Prefix}-tracis-deploy-agent"
      Source:
        Type: GITHUB
        Location: https://github.com/Tracis-ai/tracis-aws-marketplace
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        BuildSpec: builder/buildspec.yml
      SourceVersion: !If
        - SourceVersionNotSpecified
        - !FindInMap
          - ReleaseConfig
          - Current
          - SourceVersion
        - !Ref SourceVersion

  CodeBuildDeleteAgent:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${Prefix}-tracis-delete-agent"
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: ARM_LAMBDA_CONTAINER
        ComputeType: BUILD_LAMBDA_2GB
        Image: aws/codebuild/amazonlinux-aarch64-lambda-standard:python3.13
        PrivilegedMode: false
        EnvironmentVariables:
          - Name: TF_STATE_BUCKET
            Value: !Ref TfStateBucket
          - Name: TF_ACTION
            Value: destroy
          - Name: PREFIX
            Value: !Ref Prefix
          - Name: SUBNET_IDS
            Value: !Join [",", !Ref AgentSubnetIds]
          - Name: ENABLED_DB_TYPES
            Value: ""
          - Name: MYSQL_ENDPOINT
            Value: !Ref MySqlEndpoint
          - Name: MYSQL_PORT
            Value: !Ref MySqlPort
          - Name: MYSQL_DB_NAME
            Value: !Ref MySqlDbName
          - Name: MYSQL_SECURITY_GROUP_IDS
            Value: !Join [",", !Ref MySqlSecurityGroupIds]
          - Name: MYSQL_SECRET_ARN
            Value: !Ref MySqlSecretArn
          - Name: CHAT_TOOLS_SECRET_ARN
            Value: !Ref ChatToolsSecretArn
          - Name: BEDROCK_MODEL_ID
            Value: !Ref BedrockModelId
          - Name: MAX_TOKENS
            Value: !Ref BedrockModelMaxTokens
          - Name: PII_OUTPUT_ENTITY_TYPES
            Value: !Join [",", !Ref PiiOutputEntityTypes]
          - Name: AGENT_IMAGE_URL
            Value: !Ref AgentImageUrl
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref TfLogGroup
          StreamName: !Sub "${Prefix}-tracis-delete-agent"
      Source:
        Type: GITHUB
        Location: https://github.com/Tracis-ai/tracis-aws-marketplace
        GitCloneDepth: 1
        GitSubmodulesConfig:
          FetchSubmodules: false
        BuildSpec: builder/buildspec.yml
      SourceVersion: !If
        - SourceVersionNotSpecified
        - !FindInMap
          - ReleaseConfig
          - Current
          - SourceVersion
        - !Ref SourceVersion

Outputs:
  TfStateBucketName:
    Value: !Ref TfStateBucket
  DeployAgentBuildPjName:
    Value: !Ref CodeBuildDeployAgent
  DeleteAgentBuildPjName:
    Value: !Ref CodeBuildDeleteAgent
